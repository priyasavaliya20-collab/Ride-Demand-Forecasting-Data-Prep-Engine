<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <linearGradient id="chart" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#168FC4"/>
    <stop offset="100%" stop-color="#5DEAFF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- GRID -->

<g stroke="#61EFFF" opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================================================= -->
<!-- TOP DATA STREAM -->
<!-- ================================================= -->

<path d="M60 120
         C250 45 410 175 590 105
         S880 60 1050 125
         S1320 55 1535 130"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>

<circle r="6"
        fill="#64F1FF"
        filter="url(#glow)">

  <animateMotion
    dur="5s"
    repeatCount="indefinite"
    path="M60 120 C250 45 410 175 590 105 S880 60 1050 125 S1320 55 1535 130"/>

</circle>


<!-- ================================================= -->
<!-- EDA DASHBOARD -->
<!-- ================================================= -->

<g transform="translate(70 165)"
   filter="url(#strongGlow)">

  <!-- Dashboard -->

  <rect x="0"
        y="0"
        width="610"
        height="185"
        rx="20"
        fill="#061F35"
        stroke="#5DEAFF"
        stroke-width="3"/>


  <!-- Header -->

  <rect x="15"
        y="15"
        width="580"
        height="30"
        rx="7"
        fill="#0A5475"/>

  <circle cx="32" cy="30" r="5" fill="#FF6877"/>
  <circle cx="50" cy="30" r="5" fill="#FFB84D"/>
  <circle cx="68" cy="30" r="5" fill="#4CFFB3"/>

  <text x="300"
        y="35"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#D7FAFF">

    EDA_REPORT / VISUAL_ANALYSIS

  </text>


  <!-- Bar chart -->

  <g transform="translate(35 70)">

    <line x1="0" y1="85"
          x2="210" y2="85"
          stroke="#61EFFF"
          opacity=".3"/>

    <line x1="0" y1="10"
          x2="0" y2="85"
          stroke="#61EFFF"
          opacity=".3"/>


    <rect x="25"
          y="48"
          width="22"
          height="37"
          rx="3"
          fill="url(#chart)">

      <animate attributeName="height"
               values="37;48;37"
               dur="1.5s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="65"
          y="30"
          width="22"
          height="55"
          rx="3"
          fill="url(#chart)">

      <animate attributeName="height"
               values="55;42;55"
               dur="1.7s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="105"
          y="55"
          width="22"
          height="30"
          rx="3"
          fill="url(#chart)">

      <animate attributeName="height"
               values="30;45;30"
               dur="1.6s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="145"
          y="20"
          width="22"
          height="65"
          rx="3"
          fill="url(#chart)">

      <animate attributeName="height"
               values="65;50;65"
               dur="1.4s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- Line chart -->

  <g transform="translate(285 70)">

    <line x1="0" y1="85"
          x2="270" y2="85"
          stroke="#61EFFF"
          opacity=".3"/>

    <line x1="0" y1="10"
          x2="0" y2="85"
          stroke="#61EFFF"
          opacity=".3"/>

    <path d="M15 70
             L60 55
             L105 62
             L150 35
             L195 45
             L245 18"
          fill="none"
          stroke="#4CFFB3"
          stroke-width="4"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-dasharray="400"
          stroke-dashoffset="400">

      <animate attributeName="stroke-dashoffset"
               values="400;0;400"
               dur="4s"
               repeatCount="indefinite"/>

    </path>


    <g fill="#FFFFFF"
       filter="url(#glow)">

      <circle cx="15" cy="70" r="4"/>
      <circle cx="60" cy="55" r="4"/>
      <circle cx="105" cy="62" r="4"/>
      <circle cx="150" cy="35" r="4"/>
      <circle cx="195" cy="45" r="4"/>
      <circle cx="245" cy="18" r="4"/>

    </g>

  </g>

</g>


<!-- ================================================= -->
<!-- EDA LABEL -->
<!-- ================================================= -->

<text x="375"
      y="375"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      letter-spacing="3"
      fill="#5DEAFF">

  EXPLORE • ANALYZE • VISUALIZE

</text>


<!-- ================================================= -->
<!-- FLOW -->
<!-- ================================================= -->

<path d="M710 255
         C750 255 775 255 815 255"
      fill="none"
      stroke="#5DEAFF"
      stroke-width="4"
      stroke-linecap="round"
      filter="url(#glow)"/>

<path d="M805 243
         L825 255
         L805 267Z"
      fill="#5DEAFF"/>


<circle r="6"
        fill="#FFFFFF"
        filter="url(#glow)">

  <animateMotion
    dur="1.6s"
    repeatCount="indefinite"
    path="M710 255 C750 255 775 255 815 255"/>

</circle>


<!-- ================================================= -->
<!-- VISUALIZATION ICONS -->
<!-- ================================================= -->

<g transform="translate(830 180)"
   filter="url(#glow)">

  <!-- Pie chart -->

  <circle cx="65"
          cy="65"
          r="55"
          fill="#073C56"
          stroke="#5DEAFF"
          stroke-width="3"/>

  <path d="M65 65
           L65 10
           A55 55 0 0 1 112 92
           Z"
        fill="#5DEAFF"/>

  <path d="M65 65
           L112 92
           A55 55 0 0 1 35 108
           Z"
        fill="#4CFFB3"/>

  <path d="M65 65
           L35 108
           A55 55 0 0 1 65 10
           Z"
        fill="#725CFF"/>


  <!-- Pie pulse -->

  <circle cx="65"
          cy="65"
          r="8"
          fill="#FFFFFF">

    <animate attributeName="r"
             values="7;13;7"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

</g>


<!-- Scatter plot -->

<g transform="translate(970 180)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="145"
        height="130"
        rx="18"
        fill="#07324F"
        stroke="#61EFFF"
        stroke-width="2"/>

  <line x1="25" y1="105"
        x2="125" y2="105"
        stroke="#61EFFF"
        opacity=".35"/>

  <line x1="25" y1="105"
        x2="25" y2="20"
        stroke="#61EFFF"
        opacity=".35"/>


  <g fill="#5DEAFF"
     filter="url(#glow)">

    <circle cx="42" cy="88" r="5"/>
    <circle cx="55" cy="76" r="5"/>
    <circle cx="68" cy="80" r="5"/>
    <circle cx="80" cy="58" r="5"/>
    <circle cx="94" cy="65" r="5"/>
    <circle cx="108" cy="40" r="5"/>
    <circle cx="120" cy="47" r="5"/>

  </g>


  <path d="M38 92
           C65 78 85 65 122 38"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="2"/>

</g>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1320"
        y="230"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    Bonus — EDA Report

  </text>


  <text x="1320"
        y="285"
        font-family="Arial, Helvetica, sans-serif"
        font-size="43"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    &amp; Visualizations

  </text>


  <text x="1320"
        y="325"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="4"
        fill="#91EAF5">

    INSIGHTS • PATTERNS • DISTRIBUTIONS

  </text>


  <!-- Animated underline -->

  <rect x="1120"
        y="350"
        width="400"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="60;400;60"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1320;1120;1320"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- PROCESS LABELS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="13"
   fill="#67EFFF"
   opacity=".35">

  <text x="85" y="425">
    DISTRIBUTION
  </text>

  <text x="300" y="425">
    TRENDS
  </text>

  <text x="505" y="425">
    CORRELATION
  </text>

  <text x="740" y="425">
    PATTERNS
  </text>

  <text x="980" y="425">
    INSIGHTS
  </text>

</g>


<!-- Bottom line -->

<path d="M70 455H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Technical text -->

<g font-family="monospace"
   font-size="12"
   fill="#65EFFF"
   opacity=".2">

  <text x="1010" y="90">
    EDA • DATA PROFILING • VISUAL ANALYTICS
  </text>

  <text x="1090" y="475">
    EXPLORE → VISUALIZE → DISCOVER INSIGHTS
  </text>

</g>


<!-- Moving Shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
