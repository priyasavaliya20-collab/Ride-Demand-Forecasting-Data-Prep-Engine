      stroke="#5DEAFF"
      stroke-width="2"
      filter="url(#glow)"/>

<text x="135" y="31"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
      fill="#5DEAFF">01</text>

<text x="135" y="62"
      text-anchor="middle"
      font-family="Arial"
      font-size="17"
      font-weight="800"
      fill="#FFFFFF">DATA LOADING</text>

<text x="135" y="88"
      text-anchor="middle"
      font-family="monospace"
      font-size="10"
      fill="#A8DCE8">CSV • JSON • SQL • API</text>

<text x="135" y="108"
      text-anchor="middle"
      font-family="monospace"
      font-size="9"
      fill="#668E9D">IMPORT RAW DATA</text>

</g>


<!-- 02 -->

<g transform="translate(315 145)">

<rect width="270"
      height="125"
      rx="18"
