<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="620"
     viewBox="0 0 1200 620">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#020B1C"/>
  <stop offset="50%" stop-color="#073B5C"/>
  <stop offset="100%" stop-color="#010713"/>
</linearGradient>

<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0B4565"/>
  <stop offset="100%" stop-color="#06243D"/>
</linearGradient>

<linearGradient id="final" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#4CFFB3"/>
  <stop offset="100%" stop-color="#20A88F"/>
</linearGradient>

<linearGradient id="bonus" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#725CFF"/>
  <stop offset="100%" stop-color="#168FC4"/>
</linearGradient>

<linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#FFFFFF"/>
  <stop offset="50%" stop-color="#5DEAFF"/>
  <stop offset="100%" stop-color="#8C9CFF"/>
</linearGradient>

<filter id="glow">
  <feGaussianBlur stdDeviation="4" result="b"/>
  <feMerge>
    <feMergeNode in="b"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200"
      height="620"
      rx="26"
      fill="url(#bg)"/>


<!-- GRID -->

<g stroke="#5DEAFF" opacity=".045">

<path d="M0 100H1200"/>
<path d="M0 200H1200"/>
<path d="M0 300H1200"/>
<path d="M0 400H1200"/>
<path d="M0 500H1200"/>

<path d="M200 0V620"/>
<path d="M400 0V620"/>
<path d="M600 0V620"/>
<path d="M800 0V620"/>
<path d="M1000 0V620"/>

</g>


<!-- HEADER -->

<text x="600"
      y="48"
      text-anchor="middle"
      font-family="Arial"
      font-size="34"
      font-weight="900"
      letter-spacing="2"
      fill="url(#title)"
      filter="url(#glow)">

DATA PREPROCESSING WORKFLOW

</text>

<text x="600"
      y="72"
      text-anchor="middle"
      font-family="monospace"
      font-size="10"
      letter-spacing="3"
      fill="#91EAF5">

RAW DATA → CLEAN DATA → ENGINEERED DATA → MODEL READY

</text>


<!-- ================= ROW 1 ================= -->

<!-- CONNECTOR -->

<path d="M145 205H1055"
      stroke="#18536D"
      stroke-width="4"
      fill="none"/>


