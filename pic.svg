<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <!-- Main title -->
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <!-- Transformation -->
  <linearGradient id="transform" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#62F0FF"/>
    <stop offset="50%" stop-color="#168FC4"/>
    <stop offset="100%" stop-color="#725CFF"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="13" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- Grid -->

<g stroke="#61EFFF"
   opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================================================= -->
<!-- TOP DATA STREAM -->
<!-- ================================================= -->

<path d="M70 120
         C270 40 430 180 610 105
         S900 60 1080 125
         S1330 55 1530 135"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>


<g fill="#64F1FF"
   filter="url(#glow)">

  <circle r="6">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M70 120 C270 40 430 180 610 105 S900 60 1080 125 S1330 55 1530 135"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- RAW DATA -->
<!-- ================================================= -->

<g transform="translate(95 190)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="190"
        height="125"
        rx="20"
        fill="#092D4D"
        stroke="#5DEAFF"
        stroke-width="3"/>


  <!-- Uneven raw bars -->

  <g fill="#4FCFE8">

    <rect x="25" y="68"
          width="18"
          height="38"
          rx="3"/>

    <rect x="55" y="38"
          width="18"
          height="68"
          rx="3"/>

    <rect x="85" y="82"
          width="18"
          height="24"
          rx="3"/>

    <rect x="115" y="28"
          width="18"
          height="78"
          rx="3"/>

    <rect x="145" y="58"
          width="18"
          height="48"
          rx="3"/>

  </g>


  <!-- Data values -->

  <text x="95"
        y="116"
        text-anchor="middle"
        font-family="monospace"
        font-size="10"
        fill="#B8F8FF"
        opacity=".7">

    RAW VALUES

  </text>

</g>


<text x="190"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#8FEAF5">

  RAW DATA

</text>


<!-- ================================================= -->
<!-- TRANSFORMATION FLOW -->
<!-- ================================================= -->

<g fill="none"
   stroke="#5DEAFF"
   stroke-width="4"
   stroke-linecap="round"
   filter="url(#glow)">

  <path d="M300 250
           C370 250 400 250 455 250"/>

</g>


<!-- Moving transformation particles -->

<circle r="6"
        fill="#FFFFFF"
        filter="url(#glow)">

  <animateMotion
    dur="2s"
    repeatCount="indefinite"
    path="M300 250 C370 250 400 250 455 250"/>

  </circle>


<!-- Arrow -->

<path d="M445 238
         L465 250
         L445 262Z"
      fill="#5DEAFF"
      filter="url(#glow)"/>


<!-- ================================================= -->
<!-- TRANSFORMATION ENGINE -->
<!-- ================================================= -->

<g transform="translate(465 175)"
   filter="url(#bigGlow)">

  <!-- Outer rotating ring -->

  <circle cx="75"
          cy="75"
          r="70"
          fill="#083B5C"
          stroke="#5DEAFF"
          stroke-width="3"
          stroke-dasharray="12 9">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 75 75"
      to="360 75 75"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Inner circle -->

  <circle cx="75"
          cy="75"
          r="45"
          fill="url(#transform)"
          opacity=".9"/>


  <!-- Transformation arrows -->

  <path d="M48 70
           Q75 35 102 70"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M94 62
           L104 70
           L94 78"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>


  <path d="M102 82
           Q75 115 48 82"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"/>

  <path d="M56 74
           L46 82
           L56 90"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>


  <!-- Center pulse -->

  <circle cx="75"
          cy="75"
          r="8"
          fill="#FFFFFF">

    <animate attributeName="r"
             values="7;14;7"
             dur="1.4s"
             repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- OUTPUT -->
<!-- ================================================= -->

<g transform="translate(700 190)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="190"
        height="125"
        rx="20"
        fill="#063C56"
        stroke="#61EFFF"
        stroke-width="3"/>


  <!-- Normalized bars -->

  <g fill="#4CFFB3">

    <rect x="25" y="70"
          width="18"
          height="36"
          rx="3">

      <animate attributeName="height"
               values="36;42;36"
               dur="1.5s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="55" y="55"
          width="18"
          height="51"
          rx="3">

      <animate attributeName="height"
               values="51;45;51"
               dur="1.7s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="85" y="45"
          width="18"
          height="61"
          rx="3">

      <animate attributeName="height"
               values="61;54;61"
               dur="1.4s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="115" y="62"
          width="18"
          height="44"
          rx="3">

      <animate attributeName="height"
               values="44;50;44"
               dur="1.8s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="145" y="52"
          width="18"
          height="54"
          rx="3">

      <animate attributeName="height"
               values="54;47;54"
               dur="1.6s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <path d="M22 108
           Q90 78 168 88"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        opacity=".7"/>

</g>


<text x="795"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#4CFFB3">

  TRANSFORMED

</text>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1210"
        y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="2"
        fill="url(#title)"
        filter="url(#glow)">

    Data Transformation

  </text>


  <text x="1210"
        y="305"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#91EAF5">

    SCALE • TRANSFORM • NORMALIZE

  </text>


  <!-- Animated underline -->

  <rect x="960"
        y="335"
        width="500"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="70;500;70"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1210;960;1210"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- TRANSFORMATION METHODS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="95" y="410">
    RAW
  </text>

  <text x="350" y="410">
    LOG
  </text>

  <text x="520" y="410">
    SQRT
  </text>

  <text x="690" y="410">
    RECIPROCAL
  </text>

  <text x="930" y="410">
    NORMALIZED
  </text>

</g>


<!-- Bottom line -->

<path d="M70 450H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Floating technical text -->

<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="1000" y="90">
    FUNCTION TRANSFORMER • FEATURE ENGINEERING
  </text>

  <text x="1080" y="465">
    RAW → TRANSFORM → MODEL READY
  </text>

</g>


<!-- Moving shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
