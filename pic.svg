<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#084C76"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <linearGradient id="danger" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FF6B7A"/>
    <stop offset="100%" stop-color="#FFB84D"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="redGlow">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- Grid -->

<g stroke="#61EFFF" opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================= DATA STREAM ================= -->

<path d="M70 125
         C270 45 430 180 610 105
         S900 60 1080 125
         S1330 55 1530 135"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>


<g fill="#64F1FF" filter="url(#glow)">

  <circle r="6">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M70 125 C270 45 430 180 610 105 S900 60 1080 125 S1330 55 1530 135"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- DATA DISTRIBUTION / SCATTER -->
<!-- ================================================= -->

<g transform="translate(100 185)">

  <!-- Axis -->

  <line x1="0" y1="145"
        x2="390" y2="145"
        stroke="#66EFFF"
        stroke-width="2"
        opacity=".4"/>

  <line x1="35" y1="170"
        x2="35" y2="10"
        stroke="#66EFFF"
        stroke-width="2"
        opacity=".4"/>


  <!-- Normal data points -->

  <g fill="#5DEAFF" filter="url(#glow)">

    <circle cx="80" cy="112" r="6"/>
    <circle cx="105" cy="94" r="6"/>
    <circle cx="130" cy="118" r="6"/>
    <circle cx="155" cy="83" r="6"/>
    <circle cx="180" cy="105" r="6"/>
    <circle cx="205" cy="76" r="6"/>
    <circle cx="230" cy="98" r="6"/>
    <circle cx="255" cy="87" r="6"/>
    <circle cx="280" cy="105" r="6"/>
    <circle cx="305" cy="78" r="6"/>
    <circle cx="330" cy="95" r="6"/>

  </g>


  <!-- Outlier -->

  <circle cx="350"
          cy="20"
          r="12"
          fill="#FF596B"
          filter="url(#redGlow)">

    <animate attributeName="r"
             values="9;17;9"
             dur="1.3s"
             repeatCount="indefinite"/>

  </circle>


  <!-- Detection line -->

  <line x1="35"
        y1="55"
        x2="365"
        y2="55"
        stroke="#FFB84D"
        stroke-width="2"
        stroke-dasharray="7 8"
        opacity=".6"/>


  <!-- Outlier arrow -->

  <path d="M350 35
           L350 70"
        stroke="#FF6B75"
        stroke-width="3"
        marker-end="url(#arrow)"
        opacity=".8"/>

</g>


<!-- Outlier label -->

<text x="450"
      y="205"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      letter-spacing="3"
      fill="#FF6877">

  OUTLIER

</text>

<text x="450"
      y="230"
      font-family="Arial"
      font-size="13"
      fill="#FFB84D">

  DETECTED

</text>


<!-- ================================================= -->
<!-- HANDLING / FILTER -->
<!-- ================================================= -->

<g transform="translate(510 245)"
   filter="url(#glow)">

  <!-- Filter funnel -->

  <path d="M0 0
           H150
           L100 60
           V105
           L50 125
           V60
           Z"
        fill="#0B628C"
        stroke="#63EEFF"
        stroke-width="3"/>


  <!-- Filter lines -->

  <path d="M35 25H115"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>

  <path d="M50 45H100"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"/>


  <!-- Moving particles -->

  <circle cx="25" cy="-20"
          r="5"
          fill="#5DEAFF">

    <animate attributeName="cy"
             values="-20;20;70"
             dur="1.8s"
             repeatCount="indefinite"/>

  </circle>

  <circle cx="75" cy="-30"
          r="5"
          fill="#FF6877">

    <animate attributeName="cy"
             values="-30;20;70"
             dur="2.1s"
             repeatCount="indefinite"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- CLEAN DATA -->
<!-- ================================================= -->

<g transform="translate(735 185)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="300"
        height="145"
        rx="22"
        fill="#063C56"
        stroke="#61EFFF"
        stroke-width="3"/>


  <!-- Clean points -->

  <g fill="#5DEAFF">

    <circle cx="35" cy="100" r="6"/>
    <circle cx="65" cy="78" r="6"/>
    <circle cx="95" cy="92" r="6"/>
    <circle cx="125" cy="70" r="6"/>
    <circle cx="155" cy="85" r="6"/>
    <circle cx="185" cy="63" r="6"/>
    <circle cx="215" cy="78" r="6"/>
    <circle cx="245" cy="68" r="6"/>

  </g>


  <!-- Trend line -->

  <path d="M30 105
           C90 90 120 80 165 82
           S230 65 270 60"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="3"/>


  <!-- Check -->

  <circle cx="260"
          cy="110"
          r="22"
          fill="#073C39"
          stroke="#4CFFB3"
          stroke-width="3"/>

  <path d="M249 110
           L257 118
           L272 100"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="4"
        stroke-linecap="round"/>

</g>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1260"
        y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="2"
        fill="url(#title)"
        filter="url(#glow)">

    Outlier Handling

  </text>


  <text x="1260"
        y="305"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#91EAF5">

    DETECT • ANALYZE • TREAT • VALIDATE

  </text>


  <!-- Animated underline -->

  <rect x="1000"
        y="335"
        width="520"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="70;520;70"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1260;1000;1260"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- PROCESS LABELS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="100" y="395">
    NORMAL DATA
  </text>

  <text x="420" y="395">
    ANOMALY
  </text>

  <text x="620" y="395">
    HANDLE
  </text>

  <text x="820" y="395">
    VALIDATE
  </text>

  <text x="1100" y="395">
    CLEAN DATASET
  </text>

</g>


<!-- Bottom line -->

<path d="M70 445H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Floating technical text -->

<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="850" y="90">
    IQR • Z-SCORE • STATISTICAL DETECTION
  </text>

  <text x="1080" y="465">
    DETECT → TREAT → CLEAN
  </text>

</g>


<!-- Moving Shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
