<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#03142E"/>
    <stop offset="50%" stop-color="#0A4A78"/>
    <stop offset="100%" stop-color="#020A19"/>
  </linearGradient>

  <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="50%" stop-color="#55E9FF"/>
    <stop offset="100%" stop-color="#8EA8FF"/>
  </linearGradient>

  <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#69F2FF"/>
    <stop offset="45%" stop-color="#168CC5"/>
    <stop offset="100%" stop-color="#063E70"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="13" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <linearGradient id="shine">
    <stop offset="0" stop-color="white" stop-opacity="0"/>
    <stop offset=".5" stop-color="white" stop-opacity=".9"/>
    <stop offset="1" stop-color="white" stop-opacity="0"/>
  </linearGradient>
</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1600" height="700" fill="url(#bg)"/>

<g opacity=".07" stroke="#62EFFF">
  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>
  <path d="M0 500H1600"/>
  <path d="M0 600H1600"/>

  <path d="M100 0V700"/>
  <path d="M300 0V700"/>
  <path d="M500 0V700"/>
  <path d="M700 0V700"/>
  <path d="M900 0V700"/>
  <path d="M1100 0V700"/>
  <path d="M1300 0V700"/>
  <path d="M1500 0V700"/>
</g>


<!-- ================= GPS ROUTE ================= -->

<path d="M80 170
         C230 80 370 230 520 145
         S820 80 980 150
         S1280 80 1510 180"
      fill="none"
      stroke="#4DEAFF"
      stroke-width="2"
      stroke-dasharray="8 12"
      opacity=".35"/>

<circle cx="80" cy="170" r="7" fill="#5BEFFF" filter="url(#glow)">
  <animate attributeName="r"
           values="5;11;5"
           dur="1.5s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1510" cy="180" r="7" fill="#5BEFFF" filter="url(#glow)">
  <animate attributeName="r"
           values="5;11;5"
           dur="1.7s"
           repeatCount="indefinite"/>
</circle>


<!-- ================= MAIN RIDE VISUAL ================= -->

<g transform="translate(80 270)" filter="url(#glow)">

  <!-- Road -->
  <path d="M0 185 Q190 160 390 185"
        fill="none"
        stroke="#6AEFFF"
        stroke-width="5"
        opacity=".3"/>

  <path d="M15 185 H365"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-dasharray="25 18"
        opacity=".35"/>


  <!-- CAR -->
  <g>

    <!-- Car body -->
    <path d="
      M55 135
      L88 82
      Q98 65 120 65
      H285
      Q310 65 325 85
      L360 135
      H390
      Q410 135 410 155
      V172
      H25
      V153
      Q25 135 55 135 Z"
      fill="url(#carBody)"
      stroke="#78F3FF"
      stroke-width="4"/>


    <!-- Roof -->
    <path d="
      M98 80
      Q108 60 130 60
      H280
      Q302 60 317 82"
      fill="none"
      stroke="#B8FAFF"
      stroke-width="3"/>


    <!-- Windows -->
    <path d="
      M113 75
      L135 75
      H195
      V119
      H84
      L106 82
      Q109 76 113 75Z"
      fill="#041A34"
      stroke="#62EFFF"
      stroke-width="2"/>

    <path d="
      M205 75
      H275
      Q290 75 300 90
      L319 119
      H205Z"
      fill="#041A34"
      stroke="#62EFFF"
      stroke-width="2"/>


    <!-- Door lines -->
    <path d="M205 75 V160"
          stroke="#65EFFF"
          stroke-width="2"
          opacity=".5"/>


    <!-- Door handle -->
    <rect x="265" y="128"
          width="24"
          height="4"
          rx="2"
          fill="#B8FAFF"/>


    <!-- Front light -->
    <ellipse cx="398" cy="143"
             rx="9"
             ry="6"
             fill="#FFFFFF">

      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="1s"
               repeatCount="indefinite"/>

    </ellipse>


    <!-- Back light -->
    <ellipse cx="34" cy="143"
             rx="8"
             ry="6"
             fill="#FF6070"/>


    <!-- Wheels -->
    <g>
      <circle cx="105" cy="166"
              r="28"
              fill="#020A18"
              stroke="#6DEFFF"
              stroke-width="5"/>

      <circle cx="105" cy="166"
              r="9"
              fill="#62EFFF"/>

      <circle cx="330" cy="166"
              r="28"
              fill="#020A18"
              stroke="#6DEFFF"
              stroke-width="5"/>

      <circle cx="330" cy="166"
              r="9"
              fill="#62EFFF"/>
    </g>

    <!-- Car movement -->
    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;35 0;0 0"
      dur="4s"
      repeatCount="indefinite"/>

  </g>


  <!-- GPS PIN -->

  <g transform="translate(385 15)">

    <path d="
      M25 0
      C8 0 0 12 0 25
      C0 45 25 68 25 68
      S50 45 50 25
      C50 12 42 0 25 0Z"
      fill="#FFB84D"
      stroke="#FFF0B8"
      stroke-width="3"
      filter="url(#glow)"/>

    <circle cx="25" cy="25"
            r="9"
            fill="#08213B"/>

  </g>

</g>


<!-- ================= HUGE RIDE TEXT ================= -->

<text x="290"
      y="520"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="78"
      font-weight="900"
      letter-spacing="10"
      fill="url(#text)"
      filter="url(#glow)">
  RIDE
</text>

<text x="290"
      y="552"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="15"
      font-weight="600"
      letter-spacing="5"
      fill="#9DEEFF">
  MOBILITY DATA
</text>


<!-- ================= MAIN TITLE ================= -->

<g text-anchor="middle">

  <text x="950"
        y="300"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="900"
        letter-spacing="1"
        fill="url(#text)"
        filter="url(#glow)">
    Ride Demand
  </text>

  <text x="950"
        y="380"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="900"
        letter-spacing="1"
        fill="url(#text)"
        filter="url(#glow)">
    Forecasting
  </text>

  <text x="950"
        y="435"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31"
        font-weight="700"
        letter-spacing="6"
        fill="#FFB84D">
    DATA PREP ENGINE
  </text>

  <!-- Animated underline -->
  <rect x="700"
        y="458"
        width="500"
        height="3"
        rx="2"
        fill="#5CEBFF">

    <animate attributeName="width"
             values="80;500;80"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="950;700;950"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================= FORECAST GRAPH ================= -->

<g>

  <path d="
    M470 610
    C550 570 600 595 670 575
    S790 535 860 560
    S990 520 1060 535
    S1190 480 1260 500
    S1390 450 1510 465"

    fill="none"
    stroke="#45E9FF"
    stroke-width="12"
    opacity=".18"
    filter="url(#bigGlow)"/>


  <path d="
    M470 610
    C550 570 600 595 670 575
    S790 535 860 560
    S990 520 1060 535
    S1190 480 1260 500
    S1390 450 1510 465"

    fill="none"
    stroke="#65EEFF"
    stroke-width="4"
    stroke-linecap="round"
    stroke-dasharray="1300"
    stroke-dashoffset="1300">

    <animate attributeName="stroke-dashoffset"
             from="1300"
             to="0"
             dur="4s"
             repeatCount="indefinite"/>

  </path>


  <!-- Forecast points -->

  <g fill="#FFFFFF"
     stroke="#65EEFF"
     stroke-width="3">

    <circle cx="670" cy="575" r="6">
      <animate attributeName="r"
               values="5;10;5"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="860" cy="560" r="6">
      <animate attributeName="r"
               values="5;10;5"
               dur="1.7s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1060" cy="535" r="6">
      <animate attributeName="r"
               values="5;10;5"
               dur="1.9s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1260" cy="500" r="6">
      <animate attributeName="r"
               values="5;10;5"
               dur="2.1s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1510" cy="465" r="7">
      <animate attributeName="r"
               values="6;11;6"
               dur="1.3s"
               repeatCount="indefinite"/>
    </circle>

  </g>

</g>


<!-- ================= DATA PREP LABELS ================= -->

<g font-family="Arial"
   font-size="13"
   letter-spacing="2"
   fill="#8CEAF5"
   opacity=".65">

  <text x="480" y="525">CLEAN</text>
  <text x="650" y="500">TRANSFORM</text>
  <text x="850" y="480">FEATURE</text>
  <text x="1040" y="455">ENGINEER</text>
  <text x="1260" y="420">FORECAST</text>

</g>


<!-- ================= FLOATING DATA ================= -->

<g font-family="monospace"
   font-size="15"
   fill="#66EFFF"
   opacity=".25">

  <text x="470" y="120">101001 • 010101 • 110010</text>
  <text x="1170" y="120">GPS_DATA → DEMAND</text>
  <text x="470" y="665">DATA → CLEAN → TRANSFORM → FEATURE ENGINEERING</text>
  <text x="1170" y="665">MODEL → FORECAST</text>

</g>


<!-- ================= MOVING SHINE ================= -->

<rect x="-300"
      y="50"
      width="110"
      height="650"
      fill="url(#shine)"
      opacity=".08">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-500 0;2100 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>




<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152F"/>
      <stop offset="50%" stop-color="#0B4775"/>
      <stop offset="100%" stop-color="#020B1C"/>
    </linearGradient>

    <!-- Main Text -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#829CFF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1600"
        height="500"
        rx="30"
        fill="url(#bg)"/>


  <!-- Grid -->

  <g stroke="#61EFFF"
     opacity=".07">

    <path d="M0 100H1600"/>
    <path d="M0 200H1600"/>
    <path d="M0 300H1600"/>
    <path d="M0 400H1600"/>

    <path d="M200 0V500"/>
    <path d="M400 0V500"/>
    <path d="M600 0V500"/>
    <path d="M800 0V500"/>
    <path d="M1000 0V500"/>
    <path d="M1200 0V500"/>
    <path d="M1400 0V500"/>

  </g>


  <!-- ================= DATA FLOW ================= -->

  <g fill="none"
     stroke="#58E9FF"
     stroke-width="2"
     opacity=".35">

    <path d="M120 130
             C300 50 430 200 600 120
             S900 70 1080 140
             S1330 70 1500 130"/>

    <path d="M100 150
             C300 70 450 220 620 140
             S920 90 1090 160
             S1340 90 1510 150"/>

  </g>


  <!-- Moving Data Nodes -->

  <g fill="#63EEFF"
     filter="url(#glow)">

    <circle r="6">

      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        path="M120 130 C300 50 430 200 600 120 S900 70 1080 140 S1330 70 1500 130"/>

    </circle>

    <circle r="5">

      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M100 150 C300 70 450 220 620 140 S920 90 1090 160 S1340 90 1510 150"/>

    </circle>

  </g>


  <!-- ================= DATABASE ICON ================= -->

  <g transform="translate(150 205)"
     filter="url(#glow)">

    <!-- Database -->

    <ellipse cx="80"
             cy="20"
             rx="70"
             ry="25"
             fill="#0A78A9"
             stroke="#6CEFFF"
             stroke-width="3"/>

    <path d="M10 20V120
             C10 135 150 135 150 120
             V20"
          fill="#07527E"
          stroke="#6CEFFF"
          stroke-width="3"/>

    <ellipse cx="80"
             cy="55"
             rx="70"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>

    <ellipse cx="80"
             cy="90"
             rx="70"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>

    <!-- Data pulse -->

    <circle cx="80"
            cy="20"
            r="8"
            fill="#FFFFFF">

      <animate attributeName="r"
               values="6;13;6"
               dur="1.5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="1;.3;1"
               dur="1.5s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================= MERGE ARROWS ================= -->

  <g fill="none"
     stroke="#5DEAFF"
     stroke-width="4"
     stroke-linecap="round"
     filter="url(#glow)">

    <path d="M340 270
             C410 270 430 230 500 230"/>

    <path d="M340 320
             C410 320 430 360 500 360"/>

    <path d="M500 230
             C560 230 570 275 620 275"/>

    <path d="M500 360
             C560 360 570 315 620 315"/>

  </g>


  <!-- Arrow Heads -->

  <g fill="#5DEAFF">

    <path d="M615 265 L635 275 L615 285Z"/>
    <path d="M615 305 L635 315 L615 325Z"/>

  </g>


  <!-- ================= MERGED DATA ICON ================= -->

  <g transform="translate(640 245)"
     filter="url(#glow)">

    <rect x="0"
          y="0"
          width="90"
          height="90"
          rx="18"
          fill="#0B638F"
          stroke="#6CEFFF"
          stroke-width="3"/>

    <path d="M22 28H68
             M22 45H68
             M22 62H55"
          stroke="#FFFFFF"
          stroke-width="5"
          stroke-linecap="round"/>

    <circle cx="70"
            cy="62"
            r="7"
            fill="#FFB84D">

      <animate attributeName="r"
               values="5;9;5"
               dur="1.2s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================= MAIN TITLE ================= -->

  <text x="1120"
        y="260"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    Part 1: Data Loading

  </text>


  <text x="1120"
        y="330"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    &amp; Merging

  </text>


  <!-- ================= SUBTITLE ================= -->

  <text x="1120"
        y="375"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="5"
        fill="#8FEAF5">

    LOAD • COMBINE • INTEGRATE

  </text>


  <!-- Animated Underline -->

  <rect x="850"
        y="395"
        width="540"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="80;540;80"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1120;850;1120"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================= FLOATING DATA ================= -->

  <g font-family="monospace"
     font-size="14"
     fill="#65EFFF"
     opacity=".25">

    <text x="100" y="440">
      CSV → JSON → SQL → API
    </text>

    <text x="1120" y="440"
          text-anchor="middle">
      DATA SOURCES → MERGED DATASET
    </text>

  </g>


  <!-- ================= MOVING SHINE ================= -->

  <rect x="-200"
        y="0"
        width="100"
        height="500"
        fill="#FFFFFF"
        opacity=".06">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-400 0;2000 0"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

</svg>
