<!-- ================================================= -->
<!-- ANIMATED FLOW -->
<!-- ================================================= -->

<circle r="5"
        fill="#FFFFFF"
        filter="url(#glow)">

<animateMotion
 dur="6s"
 repeatCount="indefinite"
 path="M145 205H1055V315H170V355H1030"/>

</circle>


<circle r="3"
        fill="#4CFFB3"
        filter="url(#glow)">

<animateMotion
 dur="6s"
 begin="3s"
 repeatCount="indefinite"
 path="M145 205H1055V315H170V355H1030"/>

</circle>


<!-- ================================================= -->
<!-- FOOTER -->
<!-- ================================================= -->

<path d="M60 520H1140"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 10"
      opacity=".25"/>

<text x="600"
      y="555"
      text-anchor="middle"
      font-family="Arial"
      font-size="15"
      font-weight="700"
      letter-spacing="4"
      fill="#5DEAFF">

END-TO-END DATA PREPROCESSING PIPELINE

</text>

<text x="600"
      y="580"
      text-anchor="middle"
      font-family="monospace"
      font-size="10"
      letter-spacing="1"
      fill="#527D8C">

LOAD → CLEAN → OUTLIERS → TRANSFORM → SCALE → CONSTRUCT → FINAL DATASET → EDA

</text>


<!-- SHINE -->

<rect x="-200"
      y="0"
      width="80"
      height="620"
      fill="#FFFFFF"
      opacity=".035">

<animateTransform
 attributeName="transform"
 type="translate"
 values="-300 0;1500 0"
 dur="6s"
 repeatCount="indefinite"/>

</rect>

</svg>
