<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152F"/>
      <stop offset="50%" stop-color="#0B4775"/>
      <stop offset="100%" stop-color="#020B1C"/>
    </linearGradient>

    <!-- Main Text -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#829CFF"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

  </defs>


  <!-- ================= BACKGROUND ================= -->

  <rect width="1600"
        height="500"
        rx="30"
        fill="url(#bg)"/>


  <!-- Grid -->

  <g stroke="#61EFFF"
     opacity=".07">

    <path d="M0 100H1600"/>
    <path d="M0 200H1600"/>
    <path d="M0 300H1600"/>
    <path d="M0 400H1600"/>

    <path d="M200 0V500"/>
    <path d="M400 0V500"/>
    <path d="M600 0V500"/>
    <path d="M800 0V500"/>
    <path d="M1000 0V500"/>
    <path d="M1200 0V500"/>
    <path d="M1400 0V500"/>

  </g>


  <!-- ================= DATA FLOW ================= -->

  <g fill="none"
     stroke="#58E9FF"
     stroke-width="2"
     opacity=".35">

    <path d="M120 130
             C300 50 430 200 600 120
             S900 70 1080 140
             S1330 70 1500 130"/>

    <path d="M100 150
             C300 70 450 220 620 140
             S920 90 1090 160
             S1340 90 1510 150"/>

  </g>


  <!-- Moving Data Nodes -->

  <g fill="#63EEFF"
     filter="url(#glow)">

    <circle r="6">

      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        path="M120 130 C300 50 430 200 600 120 S900 70 1080 140 S1330 70 1500 130"/>

    </circle>

    <circle r="5">

      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M100 150 C300 70 450 220 620 140 S920 90 1090 160 S1340 90 1510 150"/>

    </circle>

  </g>


  <!-- ================= DATABASE ICON ================= -->

  <g transform="translate(150 205)"
     filter="url(#glow)">

    <!-- Database -->

    <ellipse cx="80"
             cy="20"
             rx="70"
             ry="25"
             fill="#0A78A9"
             stroke="#6CEFFF"
             stroke-width="3"/>

    <path d="M10 20V120
             C10 135 150 135 150 120
             V20"
          fill="#07527E"
          stroke="#6CEFFF"
          stroke-width="3"/>

    <ellipse cx="80"
             cy="55"
             rx="70"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>

    <ellipse cx="80"
             cy="90"
             rx="70"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>

    <!-- Data pulse -->

    <circle cx="80"
            cy="20"
            r="8"
            fill="#FFFFFF">

      <animate attributeName="r"
               values="6;13;6"
               dur="1.5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="1;.3;1"
               dur="1.5s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================= MERGE ARROWS ================= -->

  <g fill="none"
     stroke="#5DEAFF"
     stroke-width="4"
     stroke-linecap="round"
     filter="url(#glow)">

    <path d="M340 270
             C410 270 430 230 500 230"/>

    <path d="M340 320
             C410 320 430 360 500 360"/>

    <path d="M500 230
             C560 230 570 275 620 275"/>

    <path d="M500 360
             C560 360 570 315 620 315"/>

  </g>


  <!-- Arrow Heads -->

  <g fill="#5DEAFF">

    <path d="M615 265 L635 275 L615 285Z"/>
    <path d="M615 305 L635 315 L615 325Z"/>

  </g>


  <!-- ================= MERGED DATA ICON ================= -->

  <g transform="translate(640 245)"
     filter="url(#glow)">

    <rect x="0"
          y="0"
          width="90"
          height="90"
          rx="18"
          fill="#0B638F"
          stroke="#6CEFFF"
          stroke-width="3"/>

    <path d="M22 28H68
             M22 45H68
             M22 62H55"
          stroke="#FFFFFF"
          stroke-width="5"
          stroke-linecap="round"/>

    <circle cx="70"
            cy="62"
            r="7"
            fill="#FFB84D">

      <animate attributeName="r"
               values="5;9;5"
               dur="1.2s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================= MAIN TITLE ================= -->

  <text x="1120"
        y="260"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    Part 1: Data Loading

  </text>


  <text x="1120"
        y="330"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="56"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    &amp; Merging

  </text>


  <!-- ================= SUBTITLE ================= -->

  <text x="1120"
        y="375"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        letter-spacing="5"
        fill="#8FEAF5">

    LOAD • COMBINE • INTEGRATE

  </text>


  <!-- Animated Underline -->

  <rect x="850"
        y="395"
        width="540"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="80;540;80"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1120;850;1120"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>


  <!-- ================= FLOATING DATA ================= -->

  <g font-family="monospace"
     font-size="14"
     fill="#65EFFF"
     opacity=".25">

    <text x="100" y="440">
      CSV → JSON → SQL → API
    </text>

    <text x="1120" y="440"
          text-anchor="middle">
      DATA SOURCES → MERGED DATASET
    </text>

  </g>


  <!-- ================= MOVING SHINE ================= -->

  <rect x="-200"
        y="0"
        width="100"
        height="500"
        fill="#FFFFFF"
        opacity=".06">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-400 0;2000 0"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>

</svg>
