<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <!-- Title -->
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <!-- Cleaning Gradient -->
  <linearGradient id="clean" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#67F5FF"/>
    <stop offset="55%" stop-color="#19A8C9"/>
    <stop offset="100%" stop-color="#08709B"/>
  </linearGradient>

  <!-- Glow -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="13"/>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- Grid -->

<g stroke="#61EFFF"
   opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================================================= -->
<!-- DATA STREAM -->
<!-- ================================================= -->

<g fill="none"
   stroke="#55E9FF"
   opacity=".3">

  <path d="M70 120
           C260 40 430 180 600 105
           S900 60 1080 125
           S1330 55 1530 135"
        stroke-width="2"/>

  <path d="M70 145
           C270 65 440 205 620 130
           S920 85 1090 150
           S1330 80 1530 160"
        stroke-width="1"/>

</g>


<!-- Moving data particles -->

<g fill="#64F1FF"
   filter="url(#glow)">

  <circle r="6">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M70 120 C260 40 430 180 600 105 S900 60 1080 125 S1330 55 1530 135"/>

  </circle>

  <circle r="5">

    <animateMotion
      dur="4s"
      repeatCount="indefinite"
      path="M70 145 C270 65 440 205 620 130 S920 85 1090 150 S1330 80 1530 160"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- DIRTY DATA -->
<!-- ================================================= -->

<g transform="translate(110 190)"
   filter="url(#glow)">

  <!-- Data Card -->

  <rect x="0"
        y="0"
        width="170"
        height="125"
        rx="20"
        fill="#092D4D"
        stroke="#58E9FF"
        stroke-width="3"/>


  <!-- Data rows -->

  <g stroke="#B4F6FF"
     stroke-width="4"
     stroke-linecap="round">

    <path d="M25 30H120"/>
    <path d="M25 55H95"/>
    <path d="M25 80H135"/>
    <path d="M25 105H75"/>

  </g>


  <!-- Missing value -->

  <rect x="130"
        y="45"
        width="18"
        height="12"
        rx="3"
        fill="#FFB84D">

    <animate attributeName="opacity"
             values="1;.25;1"
             dur="1s"
             repeatCount="indefinite"/>

  </rect>


  <!-- Error marks -->

  <g stroke="#FF6575"
     stroke-width="4"
     stroke-linecap="round">

    <path d="M135 78L150 93"/>
    <path d="M150 78L135 93"/>

  </g>

</g>


<!-- Dirty label -->

<text x="195"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#FFB84D">

  RAW DATA

</text>


<!-- ================================================= -->
<!-- CLEANING BRUSH -->
<!-- ================================================= -->

<g filter="url(#glow)">

  <!-- Brush handle -->

  <rect x="365"
        y="205"
        width="145"
        height="18"
        rx="9"
        fill="#D9F9FF"
        transform="rotate(-18 365 205)"/>


  <!-- Brush head -->

  <rect x="490"
        y="185"
        width="70"
        height="70"
        rx="14"
        fill="url(#clean)"
        stroke="#8AF6FF"
        stroke-width="3"
        transform="rotate(27 525 220)"/>


  <!-- Cleaning particles -->

  <g fill="#FFFFFF">

    <circle cx="560" cy="175" r="4">
      <animate attributeName="cy"
               values="175;155;175"
               dur="1.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="585" cy="205" r="5">
      <animate attributeName="cy"
               values="205;180;205"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="570" cy="250" r="3">
      <animate attributeName="cy"
               values="250;225;250"
               dur="1.3s"
               repeatCount="indefinite"/>
    </circle>

  </g>

</g>


<!-- Cleaning arrows -->

<g stroke="#5DEAFF"
   stroke-width="4"
   fill="none"
   stroke-linecap="round">

  <path d="M285 250
           C340 250 350 250 410 250"/>

</g>

<path d="M405 240L425 250L405 260Z"
      fill="#5DEAFF"
      filter="url(#glow)"/>


<!-- ================================================= -->
<!-- CLEAN DATA -->
<!-- ================================================= -->

<g transform="translate(650 190)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="170"
        height="125"
        rx="20"
        fill="#073D55"
        stroke="#63EEFF"
        stroke-width="3"/>


  <!-- Clean rows -->

  <g stroke="#72F4FF"
     stroke-width="4"
     stroke-linecap="round">

    <path d="M25 30H145"/>
    <path d="M25 55H125"/>
    <path d="M25 80H140"/>
    <path d="M25 105H110"/>

  </g>


  <!-- Check -->

  <path d="M122 73
           L135 86
           L158 58"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round">

    <animate
      attributeName="stroke-dasharray"
      values="0 100;100 0"
      dur="1.5s"
      repeatCount="indefinite"/>

  </path>

</g>


<!-- Clean label -->

<text x="735"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#4CFFB3">

  CLEAN DATA

</text>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1120"
        y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="900"
        letter-spacing="2"
        fill="url(#title)"
        filter="url(#glow)">

    Data Cleaning

  </text>


  <text x="1120"
        y="315"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#91EAF5">

    MISSING VALUES • OUTLIERS • DUPLICATES

  </text>


  <!-- Underline -->

  <rect x="850"
        y="345"
        width="540"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="80;540;80"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1120;850;1120"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- BOTTOM PROCESS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="100" y="430">
    DETECT
  </text>

  <text x="300" y="430">
    FIX
  </text>

  <text x="480" y="430">
    REMOVE
  </text>

  <text x="690" y="430">
    VALIDATE
  </text>

  <text x="900" y="430">
    CLEAN DATASET
  </text>

</g>


<path d="M80 455H1520"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Floating binary -->

<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="1050" y="90">
    101001 • NULL • OUTLIER • DUPLICATE
  </text>

  <text x="1100" y="465">
    RAW → CLEAN → VALIDATED
  </text>

</g>


<!-- Moving shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="url(#clean)"
      opacity=".08">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
