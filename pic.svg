<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <linearGradient id="table" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0B6388"/>
    <stop offset="100%" stop-color="#07324F"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="strongGlow">
    <feGaussianBlur stdDeviation="11" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================= BACKGROUND ================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- ================= GRID ================= -->

<g stroke="#61EFFF"
   opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================= TOP DATA FLOW ================= -->

<path d="M60 120
         C250 45 410 175 590 105
         S880 60 1050 125
         S1320 55 1535 130"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>


<circle r="6"
        fill="#64F1FF"
        filter="url(#glow)">

  <animateMotion
    dur="5s"
    repeatCount="indefinite"
    path="M60 120 C250 45 410 175 590 105 S880 60 1050 125 S1320 55 1535 130"/>

</circle>


<!-- ================================================= -->
<!-- DATA PIPELINE -->
<!-- ================================================= -->

<g transform="translate(70 175)"
   filter="url(#glow)">

  <!-- Source -->

  <rect x="0"
        y="0"
        width="150"
        height="130"
        rx="18"
        fill="#092D4D"
        stroke="#5DEAFF"
        stroke-width="3"/>

  <text x="75"
        y="38"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#8FEAF5">

    DATA

  </text>

  <text x="75"
        y="62"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#FFFFFF">

    CLEANING

  </text>

  <text x="75"
        y="86"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#FFFFFF">

    TRANSFORM

  </text>

  <text x="75"
        y="110"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#4CFFB3">

    READY

  </text>

</g>


<!-- Flow arrow -->

<path d="M235 240
         C280 240 305 240 350 240"
      fill="none"
      stroke="#5DEAFF"
      stroke-width="4"
      stroke-linecap="round"
      filter="url(#glow)"/>

<path d="M340 228
         L360 240
         L340 252Z"
      fill="#5DEAFF"/>


<circle r="6"
        fill="#FFFFFF"
        filter="url(#glow)">

  <animateMotion
    dur="1.6s"
    repeatCount="indefinite"
    path="M235 240 C280 240 305 240 350 240"/>

</circle>


<!-- ================================================= -->
<!-- FINAL DATASET TABLE -->
<!-- ================================================= -->

<g transform="translate(365 155)"
   filter="url(#strongGlow)">

  <!-- Table shadow -->

  <rect x="0"
        y="0"
        width="480"
        height="175"
        rx="18"
        fill="#061F35"
        stroke="#5DEAFF"
        stroke-width="3"/>


  <!-- Header -->

  <rect x="12"
        y="12"
        width="456"
        height="38"
        rx="8"
        fill="url(#table)"/>


  <text x="35"
        y="37"
        font-family="monospace"
        font-size="13"
        fill="#FFFFFF">

    ID

  </text>

  <text x="100"
        y="37"
        font-family="monospace"
        font-size="13"
        fill="#FFFFFF">

    FEATURES

  </text>

  <text x="280"
        y="37"
        font-family="monospace"
        font-size="13"
        fill="#FFFFFF">

    VALUE

  </text>

  <text x="390"
        y="37"
        font-family="monospace"
        font-size="13"
        fill="#4CFFB3">

    STATUS

  </text>


  <!-- Rows -->

  <g font-family="monospace"
     font-size="12">

    <text x="35" y="72" fill="#8FEAF5">001</text>
    <text x="100" y="72" fill="#FFFFFF">AGE</text>
    <text x="280" y="72" fill="#FFFFFF">24</text>
    <text x="390" y="72" fill="#4CFFB3">✓</text>

    <text x="35" y="102" fill="#8FEAF5">002</text>
    <text x="100" y="102" fill="#FFFFFF">INCOME</text>
    <text x="280" y="102" fill="#FFFFFF">52000</text>
    <text x="390" y="102" fill="#4CFFB3">✓</text>

    <text x="35" y="132" fill="#8FEAF5">003</text>
    <text x="100" y="132" fill="#FFFFFF">SALES</text>
    <text x="280" y="132" fill="#FFFFFF">128</text>
    <text x="390" y="132" fill="#4CFFB3">✓</text>

    <text x="35" y="162" fill="#8FEAF5">004</text>
    <text x="100" y="162" fill="#FFFFFF">SCALED</text>
    <text x="280" y="162" fill="#FFFFFF">0.82</text>
    <text x="390" y="162" fill="#4CFFB3">✓</text>

  </g>


  <!-- Scanning line -->

  <rect x="15"
        y="55"
        width="450"
        height="2"
        fill="#5DEAFF"
        opacity=".8">

    <animate attributeName="y"
             values="55;165;55"
             dur="2.8s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- CHECK / VALIDATED -->
<!-- ================================================= -->

<g transform="translate(870 175)"
   filter="url(#glow)">

  <circle cx="75"
          cy="70"
          r="58"
          fill="#073B45"
          stroke="#4CFFB3"
          stroke-width="3"/>

  <path d="M42 70
           L65 93
           L110 45"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="8"
        stroke-linecap="round"
        stroke-linejoin="round">

    <animate attributeName="stroke-dasharray"
             values="0 200;200 0"
             dur="1.5s"
             repeatCount="indefinite"/>

  </path>

</g>


<text x="945"
      y="285"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="700"
      letter-spacing="3"
      fill="#4CFFB3">

  VALIDATED

</text>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1260"
        y="245"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="900"
        letter-spacing="2"
        fill="url(#title)"
        filter="url(#glow)">

    Final Dataset

  </text>


  <text x="1260"
        y="300"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#91EAF5">

    CLEAN • TRANSFORMED • MODEL READY

  </text>


  <!-- Animated underline -->

  <rect x="1040"
        y="330"
        width="440"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="60;440;60"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1260;1040;1260"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- PROCESS LABELS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="85" y="400">
    CLEAN
  </text>

  <text x="300" y="400">
    TRANSFORM
  </text>

  <text x="520" y="400">
    ENGINEER
  </text>

  <text x="760" y="400">
    VALIDATE
  </text>

  <text x="1000" y="400">
    FINAL DATASET
  </text>

</g>


<!-- Bottom line -->

<path d="M70 445H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Technical text -->

<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="1000" y="90">
    DATA PREPROCESSING • FEATURE ENGINEERING • QUALITY CHECK
  </text>

  <text x="1080" y="465">
    CLEAN → TRANSFORM → VALIDATE → MODEL READY
  </text>

</g>


<!-- Moving shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
