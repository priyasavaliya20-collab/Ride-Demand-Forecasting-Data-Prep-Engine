<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#64F2FF"/>
    <stop offset="50%" stop-color="#178FC5"/>
    <stop offset="100%" stop-color="#725CFF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- GRID -->

<g stroke="#61EFFF" opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- TOP DATA FLOW -->

<path d="M70 120
         C270 40 430 180 610 105
         S900 60 1080 125
         S1330 55 1530 135"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>

<circle r="6"
        fill="#64F1FF"
        filter="url(#glow)">

  <animateMotion
    dur="5s"
    repeatCount="indefinite"
    path="M70 120 C270 40 430 180 610 105 S900 60 1080 125 S1330 55 1530 135"/>

</circle>


<!-- RAW FEATURES -->

<g transform="translate(70 175)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="210"
        height="145"
        rx="20"
        fill="#092D4D"
        stroke="#5DEAFF"
        stroke-width="3"/>

  <rect x="25" y="25"
        width="70"
        height="38"
        rx="8"
        fill="#0A668D"/>

  <text x="60" y="50"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#FFFFFF">
    AGE
  </text>

  <rect x="115" y="25"
        width="70"
        height="38"
        rx="8"
        fill="#0A668D"/>

  <text x="150" y="50"
        text-anchor="middle"
        font-family="monospace"
        font-size="13"
        fill="#FFFFFF">
    INCOME
  </text>

  <rect x="25" y="82"
        width="70"
        height="38"
        rx="8"
        fill="#0A668D"/>

  <text x="60" y="107"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#FFFFFF">
    SALES
  </text>

  <rect x="115" y="82"
        width="70"
        height="38"
        rx="8"
        fill="#0A668D"/>

  <text x="150" y="107"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#FFFFFF">
    VISITS
  </text>

</g>


<text x="175"
      y="355"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#8FEAF5">

  RAW FEATURES

</text>


<!-- FLOW -->

<g fill="none"
   stroke="#5DEAFF"
   stroke-width="3"
   stroke-linecap="round">

  <path d="M295 210
           C350 210 365 230 405 230"/>

  <path d="M295 280
           C350 280 365 260 405 260"/>

</g>


<circle r="5"
        fill="#FFFFFF"
        filter="url(#glow)">

  <animateMotion
    dur="2s"
    repeatCount="indefinite"
    path="M295 210 C350 210 365 230 405 230"/>

</circle>


<!-- CONSTRUCTION ENGINE -->

<g transform="translate(400 170)"
   filter="url(#glow)">

  <circle cx="80"
          cy="80"
          r="70"
          fill="#073A59"
          stroke="#5DEAFF"
          stroke-width="3"
          stroke-dasharray="12 9">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 80 80"
      to="360 80 80"
      dur="7s"
      repeatCount="indefinite"/>

  </circle>

  <polygon points="80,38 116,58 116,100 80,122 44,100 44,58"
           fill="url(#feature)"
           stroke="#B9FAFF"
           stroke-width="3"/>

  <path d="M80 62V98
           M62 80H98"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round"/>

  <circle cx="80"
          cy="80"
          r="8"
          fill="#FFFFFF">

    <animate attributeName="r"
             values="8;17;8"
             dur="1.5s"
             repeatCount="indefinite"/>

  </circle>

</g>


<text x="480"
      y="355"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#5DEAFF">

  CONSTRUCT

</text>


<!-- FORMULA -->

<g transform="translate(570 205)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="205"
        height="95"
        rx="18"
        fill="#082F4B"
        stroke="#6AEBFF"
        stroke-width="2"/>

  <text x="102"
        y="40"
        text-anchor="middle"
        font-family="monospace"
        font-size="17"
        font-weight="700"
        fill="#FFFFFF">

    AGE × INCOME

  </text>

  <text x="102"
        y="70"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        fill="#4CFFB3">

    = NEW FEATURE

  </text>

</g>


<!-- OUTPUT FEATURES -->

<g transform="translate(825 175)"
   filter="url(#glow)">

  <rect x="0"
        y="0"
        width="225"
        height="145"
        rx="20"
        fill="#063C56"
        stroke="#4CFFB3"
        stroke-width="3"/>

  <rect x="22"
        y="22"
        width="181"
        height="38"
        rx="8"
        fill="#075A60"/>

  <text x="112"
        y="47"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#4CFFB3">

    AGE_INCOME_RATIO

  </text>

  <rect x="22"
        y="75"
        width="181"
        height="38"
        rx="8"
        fill="#075A60"/>

  <text x="112"
        y="100"
        text-anchor="middle"
        font-family="monospace"
        font-size="12"
        fill="#4CFFB3">

    SALES_PER_VISIT

  </text>

</g>


<text x="937"
      y="355"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#4CFFB3">

  NEW FEATURES

</text>


<!-- ================================================= -->
<!-- MAIN TITLE - FIXED -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1280"
        y="235"
        font-family="Arial, Helvetica, sans-serif"
        font-size="54"
        font-weight="900"
        letter-spacing="1"
        fill="url(#title)"
        filter="url(#glow)">

    Feature Construction

  </text>


  <text x="1280"
        y="285"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="4"
        fill="#91EAF5">

    COMBINE • DERIVE • CREATE

  </text>


  <rect x="1080"
        y="315"
        width="400"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="60;400;60"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1280;1080;1280"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- PROCESS -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="80" y="410">
    EXISTING
  </text>

  <text x="300" y="410">
    COMBINE
  </text>

  <text x="470" y="410">
    DERIVE
  </text>

  <text x="650" y="410">
    ENGINEER
  </text>

  <text x="900" y="410">
    NEW FEATURE
  </text>

</g>


<!-- BOTTOM -->

<path d="M70 450H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="980" y="90">
    FEATURE ENGINEERING • DERIVED VARIABLES • INTERACTIONS
  </text>

  <text x="1080" y="465">
    RAW FEATURES → CONSTRUCT → MODEL READY
  </text>

</g>


<!-- SHINE -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
