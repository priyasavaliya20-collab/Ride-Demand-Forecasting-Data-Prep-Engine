      font-family="monospace"
      font-size="9"
      fill="#668E9D">REDUCE SKEWNESS</text>

</g>


<!-- ================= DOWN FLOW ================= -->

<path d="M1030 270
         V315
         H170
         V355"
      fill="none"
      stroke="#18536D"
      stroke-width="4"/>


<!-- ================= ROW 2 ================= -->


<!-- 05 -->

<g transform="translate(30 355)">

<rect width="270"
      height="125"
      rx="18"
      fill="url(#card)"
      stroke="#5DEAFF"
      stroke-width="2"
      filter="url(#glow)"/>

<text x="135" y="31"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
      fill="#5DEAFF">05</text>

<text x="135" y="62"
      text-anchor="middle"
      font-family="Arial"
      font-size="17"
      font-weight="800"
      fill="#FFFFFF">FEATURE SCALING</text>

<text x="135" y="88"
