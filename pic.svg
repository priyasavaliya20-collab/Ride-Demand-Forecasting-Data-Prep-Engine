<text x="135" y="108"
      text-anchor="middle"
      font-family="monospace"
      font-size="9"
      fill="#668E9D">DETECT &amp; HANDLE</text>

</g>


<!-- 04 -->

<g transform="translate(885 145)">

<rect width="285"
      height="125"
      rx="18"
      fill="url(#card)"
      stroke="#5DEAFF"
      stroke-width="2"
      filter="url(#glow)"/>

<text x="142" y="31"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
