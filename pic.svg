<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#04152F"/>
    <stop offset="50%" stop-color="#075078"/>
    <stop offset="100%" stop-color="#020A1A"/>
  </linearGradient>

  <!-- Title -->
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#FFFFFF"/>
    <stop offset="45%" stop-color="#5DEAFF"/>
    <stop offset="100%" stop-color="#8CA5FF"/>
  </linearGradient>

  <!-- Scale -->
  <linearGradient id="scale" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6AF3FF"/>
    <stop offset="50%" stop-color="#168FC4"/>
    <stop offset="100%" stop-color="#6C63FF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="bigGlow">
    <feGaussianBlur stdDeviation="12" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect width="1600"
      height="500"
      rx="30"
      fill="url(#bg)"/>


<!-- Grid -->

<g stroke="#61EFFF" opacity=".07">

  <path d="M0 100H1600"/>
  <path d="M0 200H1600"/>
  <path d="M0 300H1600"/>
  <path d="M0 400H1600"/>

  <path d="M200 0V500"/>
  <path d="M400 0V500"/>
  <path d="M600 0V500"/>
  <path d="M800 0V500"/>
  <path d="M1000 0V500"/>
  <path d="M1200 0V500"/>
  <path d="M1400 0V500"/>

</g>


<!-- ================================================= -->
<!-- TOP DATA NETWORK -->
<!-- ================================================= -->

<path d="M70 120
         C270 40 430 180 610 105
         S900 60 1080 125
         S1330 55 1530 135"
      fill="none"
      stroke="#55E9FF"
      stroke-width="2"
      opacity=".3"/>

<g fill="#64F1FF" filter="url(#glow)">

  <circle r="6">

    <animateMotion
      dur="5s"
      repeatCount="indefinite"
      path="M70 120 C270 40 430 180 610 105 S900 60 1080 125 S1330 55 1530 135"/>

  </circle>

</g>


<!-- ================================================= -->
<!-- BEFORE SCALING -->
<!-- ================================================= -->

<g transform="translate(80 185)">

  <!-- Axis -->

  <line x1="25" y1="135"
        x2="270" y2="135"
        stroke="#5DEAFF"
        stroke-width="2"
        opacity=".35"/>

  <line x1="25" y1="150"
        x2="25" y2="15"
        stroke="#5DEAFF"
        stroke-width="2"
        opacity=".35"/>


  <!-- Unequal features -->

  <rect x="55" y="105"
        width="18"
        height="30"
        rx="3"
        fill="#55DCEF"/>

  <rect x="90" y="65"
        width="18"
        height="70"
        rx="3"
        fill="#55DCEF"/>

  <rect x="125" y="20"
        width="18"
        height="115"
        rx="3"
        fill="#55DCEF"/>

  <rect x="160" y="88"
        width="18"
        height="47"
        rx="3"
        fill="#55DCEF"/>

  <rect x="195" y="45"
        width="18"
        height="90"
        rx="3"
        fill="#55DCEF"/>


  <!-- Highlight wide range -->

  <path d="M125 18
           L125 5
           L220 5"
        fill="none"
        stroke="#FFB84D"
        stroke-width="2"
        stroke-dasharray="5 5"/>

</g>


<text x="210"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#FFB84D">

  BEFORE SCALING

</text>


<!-- ================================================= -->
<!-- SCALE ARROWS -->
<!-- ================================================= -->

<g stroke="#5DEAFF"
   stroke-width="4"
   fill="none"
   stroke-linecap="round"
   filter="url(#glow)">

  <path d="M330 250
           C380 250 400 250 445 250"/>

  <path d="M680 250
           C730 250 750 250 800 250"/>

</g>


<!-- Arrow heads -->

<path d="M435 238
         L455 250
         L435 262Z"
      fill="#5DEAFF"/>

<path d="M790 238
         L810 250
         L790 262Z"
      fill="#5DEAFF"/>


<!-- Moving particles -->

<circle r="6"
        fill="#FFFFFF"
        filter="url(#glow)">

  <animateMotion
    dur="1.8s"
    repeatCount="indefinite"
    path="M330 250 C380 250 400 250 445 250"/>

</circle>


<!-- ================================================= -->
<!-- SCALING ENGINE -->
<!-- ================================================= -->

<g transform="translate(455 175)"
   filter="url(#bigGlow)">

  <!-- Outer ring -->

  <circle cx="90"
          cy="75"
          r="70"
          fill="#073A59"
          stroke="#5DEAFF"
          stroke-width="3"
          stroke-dasharray="12 8">

    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 90 75"
      to="360 90 75"
      dur="6s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Ruler -->

  <rect x="35"
        y="48"
        width="110"
        height="55"
        rx="10"
        fill="url(#scale)"
        stroke="#B8F9FF"
        stroke-width="2"/>


  <!-- Scale marks -->

  <g stroke="#FFFFFF"
     stroke-width="3">

    <path d="M50 65V85"/>
    <path d="M68 58V92"/>
    <path d="M86 65V85"/>
    <path d="M104 58V92"/>
    <path d="M122 65V85"/>
    <path d="M140 58V92"/>

  </g>


  <!-- Center pulse -->

  <circle cx="90"
          cy="75"
          r="8"
          fill="#FFFFFF">

    <animate attributeName="r"
             values="7;15;7"
             dur="1.4s"
             repeatCount="indefinite"/>

  </circle>

</g>


<text x="545"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#5DEAFF">

  SCALE FEATURES

</text>


<!-- ================================================= -->
<!-- AFTER SCALING -->
<!-- ================================================= -->

<g transform="translate(820 185)">

  <!-- Axis -->

  <line x1="25" y1="135"
        x2="270" y2="135"
        stroke="#5DEAFF"
        stroke-width="2"
        opacity=".35"/>

  <line x1="25" y1="150"
        x2="25" y2="15"
        stroke="#5DEAFF"
        stroke-width="2"
        opacity=".35"/>


  <!-- Equal-scale bars -->

  <g fill="#4CFFB3">

    <rect x="55" y="72"
          width="18"
          height="63"
          rx="3">

      <animate attributeName="height"
               values="63;55;63"
               dur="1.5s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="95" y="55"
          width="18"
          height="80"
          rx="3">

      <animate attributeName="height"
               values="80;70;80"
               dur="1.7s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="135" y="65"
          width="18"
          height="70"
          rx="3">

      <animate attributeName="height"
               values="70;78;70"
               dur="1.6s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="175" y="75"
          width="18"
          height="60"
          rx="3">

      <animate attributeName="height"
               values="60;68;60"
               dur="1.8s"
               repeatCount="indefinite"/>

    </rect>

    <rect x="215" y="60"
          width="18"
          height="75"
          rx="3">

      <animate attributeName="height"
               values="75;65;75"
               dur="1.4s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- Normalized range -->

  <rect x="45"
        y="25"
        width="210"
        height="105"
        rx="8"
        fill="none"
        stroke="#4CFFB3"
        stroke-width="1"
        stroke-dasharray="5 6"
        opacity=".4"/>

</g>


<text x="955"
      y="350"
      text-anchor="middle"
      font-family="Arial"
      font-size="14"
      font-weight="600"
      letter-spacing="3"
      fill="#4CFFB3">

  SCALED FEATURES

</text>


<!-- ================================================= -->
<!-- MAIN TITLE -->
<!-- ================================================= -->

<g text-anchor="middle">

  <text x="1260"
        y="250"
        font-family="Arial, Helvetica, sans-serif"
        font-size="66"
        font-weight="900"
        letter-spacing="2"
        fill="url(#title)"
        filter="url(#glow)">

    Feature Scaling

  </text>


  <text x="1260"
        y="305"
        font-family="Arial, Helvetica, sans-serif"
        font-size="17"
        font-weight="600"
        letter-spacing="5"
        fill="#91EAF5">

    STANDARDIZE • NORMALIZE • BALANCE

  </text>


  <!-- Animated underline -->

  <rect x="1010"
        y="335"
        width="500"
        height="3"
        rx="2"
        fill="#5DEAFF">

    <animate attributeName="width"
             values="70;500;70"
             dur="3s"
             repeatCount="indefinite"/>

    <animate attributeName="x"
             values="1260;1010;1260"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

</g>


<!-- ================================================= -->
<!-- METHODS -->
<!-- ================================================= -->

<g font-family="monospace"
   font-size="14"
   fill="#67EFFF"
   opacity=".35">

  <text x="90" y="410">
    RAW RANGE
  </text>

  <text x="400" y="410">
    SCALE
  </text>

  <text x="610" y="410">
    MIN-MAX
  </text>

  <text x="850" y="410">
    STANDARDIZE
  </text>

  <text x="1160" y="410">
    MODEL READY
  </text>

</g>


<!-- Bottom line -->

<path d="M70 450H1530"
      stroke="#5DEAFF"
      stroke-width="1"
      stroke-dasharray="5 12"
      opacity=".25"/>


<!-- Technical text -->

<g font-family="monospace"
   font-size="13"
   fill="#65EFFF"
   opacity=".2">

  <text x="1010" y="90">
    MINMAXSCALER • STANDARDSCALER • ROBUSTSCALER
  </text>

  <text x="1100" y="465">
    RAW FEATURES → SCALED FEATURES → MODEL READY
  </text>

</g>


<!-- Moving shine -->

<rect x="-250"
      y="0"
      width="100"
      height="500"
      fill="#FFFFFF"
      opacity=".06">

  <animateTransform
    attributeName="transform"
    type="translate"
    values="-400 0;2000 0"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

</svg>
