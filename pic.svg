<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="500"
     viewBox="0 0 1600 500">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06152F"/>
      <stop offset="50%" stop-color="#0B4775"/>
      <stop offset="100%" stop-color="#020B1C"/>
    </linearGradient>

    <!-- Title -->
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#5DEAFF"/>
      <stop offset="100%" stop-color="#829CFF"/>
    </linearGradient>

    <!-- Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4DE6FF"/>
      <stop offset="100%" stop-color="#FFB84D"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

  </defs>


  <!-- ================================================= -->
  <!-- BACKGROUND -->
  <!-- ================================================= -->

  <rect width="1600"
        height="500"
        rx="30"
        fill="url(#bg)"/>


  <!-- Grid -->

  <g stroke="#61EFFF"
     opacity=".07">

    <path d="M0 100H1600"/>
    <path d="M0 200H1600"/>
    <path d="M0 300H1600"/>
    <path d="M0 400H1600"/>

    <path d="M200 0V500"/>
    <path d="M400 0V500"/>
    <path d="M600 0V500"/>
    <path d="M800 0V500"/>
    <path d="M1000 0V500"/>
    <path d="M1200 0V500"/>
    <path d="M1400 0V500"/>

  </g>


  <!-- ================================================= -->
  <!-- TOP DATA NETWORK -->
  <!-- ================================================= -->

  <g fill="none"
     stroke="#58E9FF"
     opacity=".3">

    <path d="M70 120
             C270 40 430 180 610 105
             S900 60 1080 125
             S1320 55 1530 135"
          stroke-width="2"/>

    <path d="M70 145
             C270 65 440 205 620 130
             S920 85 1090 150
             S1330 80 1530 160"
          stroke-width="1"/>

  </g>


  <!-- Moving Data Nodes -->

  <g fill="#63EEFF"
     filter="url(#glow)">

    <circle r="6">

      <animateMotion
        dur="5s"
        repeatCount="indefinite"
        path="M70 120 C270 40 430 180 610 105 S900 60 1080 125 S1320 55 1530 135"/>

    </circle>

    <circle r="5">

      <animateMotion
        dur="4s"
        repeatCount="indefinite"
        path="M70 145 C270 65 440 205 620 130 S920 85 1090 150 S1330 80 1530 160"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- DATABASE -->
  <!-- ================================================= -->

  <g transform="translate(130 190)"
     filter="url(#glow)">

    <!-- Database body -->

    <path d="M0 35
             V125
             C0 145 150 145 150 125
             V35"
          fill="#07527E"
          stroke="#6CEFFF"
          stroke-width="3"/>


    <!-- Top -->

    <ellipse cx="75"
             cy="35"
             rx="75"
             ry="27"
             fill="#0B7BAA"
             stroke="#6CEFFF"
             stroke-width="3"/>


    <!-- Middle -->

    <ellipse cx="75"
             cy="68"
             rx="75"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>


    <!-- Lower -->

    <ellipse cx="75"
             cy="100"
             rx="75"
             ry="25"
             fill="none"
             stroke="#63EFFF"
             stroke-width="2"
             opacity=".6"/>


    <!-- Data pulse -->

    <circle cx="75"
            cy="35"
            r="8"
            fill="#FFFFFF">

      <animate attributeName="r"
               values="6;14;6"
               dur="1.5s"
               repeatCount="indefinite"/>

      <animate attributeName="opacity"
               values="1;.3;1"
               dur="1.5s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- Database Label -->

  <text x="205"
        y="360"
        text-anchor="middle"
        font-family="Arial"
        font-size="14"
        font-weight="600"
        letter-spacing="3"
        fill="#8FEAF5">

    DATA SOURCES

  </text>


  <!-- ================================================= -->
  <!-- DATA FLOW -->
  <!-- ================================================= -->

  <g fill="none"
     stroke="#5DEAFF"
     stroke-width="4"
     stroke-linecap="round"
     filter="url(#glow)">

    <path d="M300 235
             C390 235 420 190 510 190"/>

    <path d="M300 290
             C390 290 420 335 510 335"/>

    <path d="M510 190
             C560 190 575 235 625 250"/>

    <path d="M510 335
             C560 335 575 295 625 275"/>

  </g>


  <!-- Moving particles -->

  <circle r="6"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animateMotion
      dur="2.5s"
      repeatCount="indefinite"
      path="M300 235 C390 235 420 190 510 190 C560 190 575 235 625 250"/>

  </circle>


  <circle r="6"
          fill="#FFB84D"
          filter="url(#glow)">

    <animateMotion
      dur="2.8s"
      repeatCount="indefinite"
      path="M300 290 C390 290 420 335 510 335 C560 335 575 295 625 275"/>

  </circle>


  <!-- ================================================= -->
  <!-- MERGED DATA -->
  <!-- ================================================= -->

  <g transform="translate(625 220)"
     filter="url(#glow)">

    <rect x="0"
          y="0"
          width="90"
          height="90"
          rx="20"
          fill="#0B638F"
          stroke="#6CEFFF"
          stroke-width="3"/>


    <!-- File/Data Symbol -->

    <path d="M25 28H65
             M25 45H65
             M25 62H52"
          stroke="#FFFFFF"
          stroke-width="5"
          stroke-linecap="round"/>


    <circle cx="67"
            cy="62"
            r="7"
            fill="#FFB84D">

      <animate attributeName="r"
               values="5;10;5"
               dur="1.2s"
               repeatCount="indefinite"/>

    </circle>

  </g>


  <!-- ================================================= -->
  <!-- MAIN TITLE -->
  <!-- ================================================= -->

  <g text-anchor="middle">

    <text x="1080"
          y="250"
          font-family="Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="900"
          letter-spacing="1"
          fill="url(#title)"
          filter="url(#glow)">

      Data Loading

    </text>


    <text x="1080"
          y="325"
          font-family="Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="900"
          letter-spacing="1"
          fill="url(#title)"
          filter="url(#glow)">

      &amp; Merging

    </text>


    <!-- Subtitle -->

    <text x="1080"
          y="370"
          font-family="Arial, Helvetica, sans-serif"
          font-size="17"
          font-weight="600"
          letter-spacing="5"
          fill="#8FEAF5">

      LOAD • COMBINE • INTEGRATE

    </text>


    <!-- Animated underline -->

    <rect x="820"
          y="392"
          width="520"
          height="3"
          rx="2"
          fill="url(#accent)">

      <animate attributeName="width"
               values="70;520;70"
               dur="3s"
               repeatCount="indefinite"/>

      <animate attributeName="x"
               values="1080;820;1080"
               dur="3s"
               repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- ================================================= -->
  <!-- SOURCE LABELS -->
  <!-- ================================================= -->

  <g font-family="monospace"
     font-size="14"
     fill="#66EFFF"
     opacity=".3">

    <text x="80" y="430">
      CSV
    </text>

    <text x="180" y="430">
      JSON
    </text>

    <text x="280" y="430">
      SQL
    </text>

    <text x="380" y="430">
      API
    </text>

    <text x="720" y="430">
      MERGED DATASET
    </text>

  </g>


  <!-- ================================================= -->
  <!-- BOTTOM DATA FLOW -->
  <!-- ================================================= -->

  <path d="M80 450
           H1520"
        stroke="#5DEAFF"
        stroke-width="1"
        stroke-dasharray="5 12"
        opacity=".25"/>


  <!-- Moving Shine -->

  <rect x="-250"
        y="0"
        width="100"
        height="500"
        fill="url(#accent)"
        opacity=".08">

    <animateTransform
      attributeName="transform"
      type="translate"
      values="-400 0;2000 0"
      dur="5s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Floating Data -->

  <g font-family="monospace"
     font-size="13"
     fill="#65EFFF"
     opacity=".2">

    <text x="1050" y="80">
      101001 • 010101 • 110010
    </text>

    <text x="1180" y="460">
      DATA → MERGE → READY
    </text>

  </g>

</svg>
