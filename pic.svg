      font-family="monospace"
      font-size="10"
      fill="#A8DCE8">MISSING • DUPLICATES</text>

<text x="135" y="108"
      text-anchor="middle"
      font-family="monospace"
      font-size="9"
      fill="#668E9D">CLEAN &amp; VALIDATE</text>

</g>


<!-- 03 -->

<g transform="translate(600 145)">

<rect width="270"
      height="125"
      rx="18"
      fill="url(#card)"
      stroke="#5DEAFF"
      stroke-width="2"
      filter="url(#glow)"/>

<text x="135" y="31"
      text-anchor="middle"
      font-family="monospace"
      font-size="12"
